<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">Elsevar - Ishlab chiqarish va Nazorat Tizimi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-box">
            <img src="logo.jpg" alt="Elsevar Logo" class="header-logo">
            <span class="brand-name">ELSEVAR</span>
        </div>
        
        <select id="langSwitcher" class="lang-select">
            <option value="uz">O'zbekcha</option>
            <option value="uz_cyrl">Ўзбекcha</option>
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="tg">Тоҷикӣ</option>
        </select>
    </header>

    <div class="main-container">
        <div class="hero-title">
            <img src="logo.jpg" alt="Elsevar" class="hero-logo">
            <h1 id="heroHeading">Elsevar Korxonasi</h1>
            <p id="heroSubheading">Face-ID Davomat va Nazorat Tizimi</p>
        </div>

        <div class="card">
            <h2 class="card-title" id="cardTitle">Face-ID Davomat</h2>

            <div class="form-group">
                <label id="lblExcel" for="excelFileInput">Excel xodimlari ro'yxatini yuklash</label>
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="form-control">
            </div>

            <div class="form-group">
                <label id="lblSelectEmp" for="employeeSelect">Xodimni tanlang</label>
                <select id="employeeSelect" class="form-control">
                    <option value="" id="optDefaultEmp">-- Avval Excel yuklang yoki qo'lda kiriting --</option>
                </select>
            </div>

            <div class="form-group">
                <label id="lblManualName" for="employeeName">Yoki ism-familiyangizni kiriting</label>
                <input type="text" id="employeeName" class="form-control" placeholder="Ism va Familiya">
            </div>

            <div class="webcam-box">
                <video id="webcam" autoplay playsinline></video>
                <button id="switchCamBtn" type="button" class="btn-switch">🔄 Kamera</button>
            </div>

            <!-- Ikita alohida tugma: Kelish va Ketish -->
            <div class="btn-group-action" style="display: flex; gap: 10px;">
                <button id="scanInBtn" class="btn-primary" style="background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);">🟢 Ishga kelish</button>
                <button id="scanOutBtn" class="btn-primary" style="background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);">🔴 Ishdan ketish</button>
            </div>

            <p id="faceResult"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
