<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elsevar - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Admin Kirish</h3>
            <div class="form-group">
                <input type="text" id="adminUser" class="form-control" placeholder="Login">
            </div>
            <div class="form-group">
                <input type="password" id="adminPass" class="form-control" placeholder="Parol">
            </div>
            <button onclick="adminLogin()" class="btn-primary">Kirish</button>
            <p id="loginError" style="color: #f87171; margin-top: 10px; font-size: 13px;"></p>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display: none; padding: 20px; max-width: 1200px; margin: 0 auto;">
        <h2>🛠 Elsevar - Admin Boshqaruv Paneli</h2>
        
        <div style="display: flex; gap: 10px; margin: 15px 0;">
            <button onclick="loadData()" class="btn-primary" style="width: auto; padding: 10px 20px; background: #2563eb;">🔄 Ma'lumotlarni Yangilash</button>
            <a href="/download-excel" download="davomat.xlsx" class="btn-primary" style="width: auto; padding: 10px 20px; background: #16a34a; text-decoration: none; display: inline-block; text-align: center;">📥 Excel Faylni Yuklab Olish</a>
        </div>
        
        <div style="overflow-x: auto; background: rgba(30, 41, 59, 0.9); padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
            <table id="davomatTable" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; color: #f8fafc;">
                <thead>
                    <tr style="border-bottom: 2px solid #334155; color: #38bdf8;">
                        <th style="padding: 12px;">Ism Familiya</th>
                        <th style="padding: 12px;">Smena</th>
                        <th style="padding: 12px;">Kelgan Vaqti</th>
                        <th style="padding: 12px;">Ketgan Vaqti</th>
                        <th style="padding: 12px;">Jami Soat</th>
                        <th style="padding: 12px;">Kechikish</th>
                        <th style="padding: 12px;">Oylik (so'm)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Ma'lumotlar tushadi -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function adminLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            const res = await fetch('/admin-login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            const data = await res.json();

            if (data.status === 'success') {
                document.getElementById('adminLoginModal').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadData();
            } else {
                document.getElementById('loginError').innerText = "Login yoki parol xato!";
            }
        }

        async function loadData() {
            const res = await fetch('/get-davomat');
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid rgba(255,255,255,0.08)';
                tr.innerHTML = `
                    <td style="padding: 12px; font-weight: 500;">${row[0]}</td>
                    <td style="padding: 12px;">${row[1]}</td>
                    <td style="padding: 12px; color: #4ade80;">${row[2] || '-'}</td>
                    <td style="padding: 12px; color: #f87171;">${row[3] || '-'}</td>
                    <td style="padding: 12px;">${row[4] || 0} soat</td>
                    <td style="padding: 12px;">${row[5] ? row[5] + ' daq' : '-'}</td>
                    <td style="padding: 12px; font-weight: bold; color: #facc15;">${row[7] ? Number(row[7]).toLocaleString() : 0} so'm</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
